[package]
name = "libabar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Wayland layer-shell bar runtime."

[features]
default = []
clock = ["dep:jiff"]
keyboard = []
tray = []
workspaces = []
window = []
mpris = []
svg = ["dep:resvg"]

[dependencies]
jiff = { version = "1", optional = true }
rustix = { version = "1", features = ["event", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net", "signal"] }
tracing = "0.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
vello_cpu = "0.4"
parley = "0.13"

tempfile = "3"
resvg = { version = "0.50", optional = true }
